name = "z17-sports-api"
main = "src/index.ts"
compatibility_date = "2025-05-01"
compatibility_flags = ["nodejs_compat"]

[vars]
FIREBASE_PROJECT_ID = "z17-sports"
ENVIRONMENT = "local"

[[d1_databases]]
binding = "DB"
database_name = "z17-sports-db"
# Local-only placeholder. Configure an actual D1 UUID in a separate production config before any deployment.
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"
